name: Add protected admin route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin:
    if: ${{ !contains(github.event.head_commit.message, 'Add protected Nexauren admin route') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'worker-v2.js';
          let s = fs.readFileSync(path, 'utf8');

          if (!s.includes('async function isAdmin(req, env)')) {
            const marker = '\nfunction shell(body, title, user = null) {';
            const helper = `\nasync function isAdmin(req, env) {\n  const u = await me(req, env);\n  const configured = String(env.ADMIN_EMAIL || '').trim().toLowerCase();\n  if (!u || !configured) return false;\n  return String(u.email || '').trim().toLowerCase() === configured;\n}\n\nasync function adminPage(req, env) {\n  const u = await me(req, env);\n  if (!u) return red('/login?next=/admin');\n  if (!String(env.ADMIN_EMAIL || '').trim()) {\n    return new Response('Admin não configurado: defina o secret ADMIN_EMAIL no Worker.', { status: 503, headers: { 'Content-Type': 'text/plain; charset=UTF-8' } });\n  }\n  if (!(await isAdmin(req, env))) return new Response('Acesso negado', { status: 403 });\n\n  const [users, tools, plans, notifications] = await Promise.all([\n    env.DB.prepare('SELECT COUNT(*) AS count FROM users').first(),\n    env.DB.prepare('SELECT COUNT(*) AS count FROM tools').first(),\n    env.DB.prepare('SELECT COUNT(*) AS count FROM plans').first(),\n    env.DB.prepare('SELECT COUNT(*) AS count FROM notifications').first()\n  ]);\n\n  return shell(\`<main class="wrap"><span class="pill">Nexauren Admin</span><h1>Painel administrativo</h1><p class="lead">Acesso privado. Apenas o email definido no secret <b>ADMIN_EMAIL</b> pode entrar neste painel.</p><div class="grid"><section class="card"><span class="pill">USUÁRIOS</span><div class="credits blue">\${Number(users?.count || 0).toLocaleString()}</div><p class="muted">Contas registadas</p></section><section class="card"><span class="pill">FERRAMENTAS</span><div class="credits">\${Number(tools?.count || 0).toLocaleString()}</div><p class="muted">Ferramentas registadas</p></section><section class="card"><span class="pill">PLANOS</span><div class="credits">\${Number(plans?.count || 0).toLocaleString()}</div><p class="muted">Planos configurados</p></section><section class="card"><span class="pill">NOTIFICAÇÕES</span><div class="credits">\${Number(notifications?.count || 0).toLocaleString()}</div><p class="muted">Registos de notificações</p></section></div><div class="grid" style="margin-top:20px"><section class="card"><h2>Usuários</h2><p class="muted">Gerir contas, eliminar utilizadores e controlar o acesso.</p></section><section class="card"><h2>Planos e créditos</h2><p class="muted">Gerir Free, Pro, Premium e pacotes de créditos.</p></section><section class="card"><h2>PayPal Sandbox</h2><p class="muted">Área reservada para configurar produtos, planos e pagamentos PayPal.</p></section><section class="card"><h2>Blog / Editor</h2><p class="muted">Gestão editorial e notificações da plataforma.</p></section></div><section class="card" style="margin-top:20px"><div class="row"><div><b>Conta administrativa</b><div class="muted">\${esc(u.email)}</div></div><a class="btn primary" href="/dashboard">Voltar ao dashboard</a></div></section></main>\`, 'Admin', u);\n}\n`;
            if (!s.includes(marker)) throw new Error('shell marker not found');
            s = s.replace(marker, helper + marker);
          }

          if (!s.includes('p === "/admin" || p === "/admin/"')) {
            const marker = '\n  if (p==="/register"&&req.method==="POST")';
            const route = `\n  if (p === "/admin" || p === "/admin/") return adminPage(req, env);\n`;
            if (!s.includes(marker)) {
              const alt = '\n  if (p === "/register" && req.method === "POST")';
              if (!s.includes(alt)) throw new Error('register route marker not found');
              s = s.replace(alt, route + alt);
            } else {
              s = s.replace(marker, route + marker);
            }
          }

          fs.writeFileSync(path, s);
          NODE
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add protected Nexauren admin route'
          git push
