name: Use frontend tool registry page

on:
  push:
    paths:
      - .github/workflows/use-registry-tools-page.yml

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route /tools to the registry page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          text = p.read_text()
          old = "if(p==='/tools')return tools(req,env);"
          new = "if(p==='/tools')return env.ASSETS.fetch(new Request(new URL('/tools/index.html',req.url),req));"
          if old not in text:
              raise SystemExit('Expected /tools route was not found; refusing to modify worker.js')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit worker routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Route tools page to frontend registry [skip ci]"
          git push
