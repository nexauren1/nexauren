name: Apply Nexauren site branding metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add favicon and social preview metadata to every HTML page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("frontend")
          favicon = '<link rel="icon" type="image/png" href="/favicon.png">'
          apple = '<link rel="apple-touch-icon" href="/favicon.png">'
          og = '<meta property="og:site_name" content="Nexauren">\n<meta property="og:type" content="website">\n<meta property="og:image" content="https://nexaurenstory.com/favicon.png">\n<meta property="og:image:type" content="image/png">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:site" content="Nexauren">\n<meta name="twitter:image" content="https://nexaurenstory.com/favicon.png">'

          changed = []

          for path in sorted(root.rglob("*.html")):
              text = path.read_text(encoding="utf-8")
              original = text

              text = re.sub(r'\s*<link\s+rel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'][^>]*>', '', text, flags=re.I)
              text = re.sub(r'\s*<meta\s+(?:property|name)=["\'](?:og:site_name|og:type|og:image|og:image:type|twitter:card|twitter:site|twitter:image)["\'][^>]*>', '', text, flags=re.I)

              block = "\n" + favicon + "\n" + apple + "\n" + og + "\n"
              text = re.sub(r'(<head\b[^>]*>)', r'\1' + block, text, count=1, flags=re.I)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} HTML pages")
          for item in changed:
              print(item)
          PY

      - name: Commit metadata changes
        run: |
          git config user.name "nexauren-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend
          if git diff --cached --quiet; then
            echo "No metadata changes needed."
            exit 0
          fi
          git commit -m "Apply Nexauren favicon and social preview to all pages"
          git push
