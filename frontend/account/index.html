<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Nexauren</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}.nav{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:950;letter-spacing:.08em;text-decoration:none;color:#101828}.brand span{color:#7c3aed}.nav a{color:#475467;text-decoration:none;font-weight:750}.wrap{width:min(760px,92vw);margin:auto;padding:50px 0 70px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 15px 45px #1d4ed80b}.row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #edf0f5}.muted{color:#667085}.footer{text-align:center;border-top:1px solid #e5e7eb;padding:25px;color:#98a2b3}</style>
  <script src="/js/G4A.js" defer></script>
</head><body><nav class="nav"><a class="brand" href="/">NEXA<span>UREN</span></a><a href="/dashboard/">Dashboard</a></nav><main class="wrap"><h1>Account</h1><section class="card"><div class="row"><b>Name</b><span id="name">—</span></div><div class="row"><b>Email</b><span id="email">—</span></div><div class="row"><b>Plan</b><span id="plan">—</span></div><div class="row"><b>Plan credits</b><span id="credits">—</span></div><div class="row"><b>Purchased credits</b><span id="purchased">—</span></div></section></main><footer class="footer">© 2026 Nexauren</footer><script>(async()=>{const r=await fetch('/api/account');if(r.status===401){location.href='/login/';return}const d=await r.json();name.textContent=d.user?.name||'—';email.textContent=d.user?.email||'—';plan.textContent=d.subscription?.plan_name||'Free';credits.textContent=Number(d.balance?.plan_credits||0).toLocaleString();purchased.textContent=Number(d.balance?.purchased_credits||0).toLocaleString()})()</script><script src="/js/global-loader.js"></script></body></html>
