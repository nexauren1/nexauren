<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ferramentas Nexauren para a categoria Audio.">
  <meta name="robots" content="index,follow">
  <title>Audio Tools | Nexauren</title>
  <script src="/js/global-loader.js"></script>
  <style>
    .category-page{width:min(1120px,92vw);margin:auto;padding:58px 0 80px}
    .category-hero{display:grid;grid-template-columns:1fr 360px;gap:42px;align-items:center;margin-bottom:38px}
    .category-kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:#eef4ff;color:#3157e8;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .category-page h1{margin:17px 0 12px;font-size:clamp(42px,6vw,68px);line-height:.98;letter-spacing:-.055em;color:#172554}
    .category-page .lead{margin:0;color:#64748b;font-size:17px;line-height:1.7;max-width:650px}
    .category-art{min-height:250px;border-radius:30px;background:linear-gradient(135deg,#3157e8,#7c3aed);box-shadow:0 30px 70px rgba(49,87,232,.22);display:grid;place-items:center;color:#fff;font-size:76px;position:relative;overflow:hidden}
    .category-art:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-80px;background:rgba(6,182,212,.35)}
    .category-art span{position:relative;z-index:1}
    .tools-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .tool-card{display:flex;flex-direction:column;padding:21px;border:1px solid #dfe7f5;border-radius:21px;background:rgba(255,255,255,.78);box-shadow:0 18px 50px rgba(46,66,120,.09);min-height:190px}
    .tool-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#eff4ff;color:#3157e8;font-size:20px;font-weight:900}
    .tool-card h2{margin:17px 0 7px;font-size:19px;color:#172554;letter-spacing:-.025em}
    .tool-card p{margin:0;color:#64748b;font-size:14px;line-height:1.6;flex:1}
    .tool-open{display:inline-flex;justify-content:center;margin-top:18px;padding:11px 14px;border-radius:12px;background:linear-gradient(135deg,#3157e8,#7c3aed);color:#fff;font-size:13px;font-weight:850}
    .empty{padding:38px;border:1px dashed #cbd5e1;border-radius:22px;background:rgba(255,255,255,.7);color:#64748b;text-align:center}
    .back{display:inline-flex;margin-top:28px;color:#3157e8;font-weight:800;font-size:13px}
    @media(max-width:800px){.category-page{padding-top:34px}.category-hero{grid-template-columns:1fr;gap:24px}.category-art{min-height:190px;font-size:58px}.tools-list{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.category-page{width:calc(100% - 28px)}.category-page h1{font-size:44px}.category-page .lead{font-size:15px}.tools-list{grid-template-columns:1fr}.tool-card{min-height:0}}
  </style>
</head>
<body>
  <main class="category-page">
    <section class="category-hero">
      <div>
        <span class="category-kicker" id="kicker">Nexauren Tools</span>
        <h1 id="title">Audio</h1>
        <p class="lead" id="description">Conversão e ferramentas para trabalhar com áudio.</p>
      </div>
      <div class="category-art" aria-hidden="true"><span id="icon">♫</span></div>
    </section>
    <section>
      <div id="tools" class="tools-list"></div>
      <a class="back" href="/tools/">← Voltar para todas as ferramentas</a>
    </section>
  </main>
  <script type="module">
    import { getCategory } from "/categories/category.js";
    const slug = location.pathname.split("/").filter(Boolean)[1] || "audio";
    const category = getCategory(slug);
    const descriptions = {
      audio: "Conversão e ferramentas para trabalhar com áudio.",
      image: "Ferramentas para editar, melhorar e preparar imagens.",
      pdf: "Organize e transforme documentos com menos esforço.",
      text: "Ferramentas inteligentes para escrever, transformar e organizar texto.",
      productivity: "Ferramentas práticas para organizar tarefas e trabalhar melhor.",
      business: "Recursos digitais para tarefas e fluxos de trabalho de negócio.",
      marketplace: "Ferramentas para preparar conteúdos e materiais para venda online."
    };
    const icons = {audio:"♫",image:"✦",pdf:"PDF",text:"Aa",productivity:"✓",business:"▦",marketplace:"◇"};
    if (!category) location.replace("/tools/");
    else {
      document.title = `${category.name} Tools | Nexauren`;
      document.getElementById("kicker").textContent = `${category.name} · Nexauren Tools`;
      document.getElementById("title").textContent = category.name;
      document.getElementById("description").textContent = descriptions[slug] || `Ferramentas Nexauren para ${category.name}.`;
      document.getElementById("icon").textContent = icons[slug] || "◈";
      const root = document.getElementById("tools");
      if (!category.tools.length) {
        root.innerHTML = `<div class="empty"><strong>Estamos a preparar esta área.</strong><br>Novas ferramentas de ${category.name} serão adicionadas em breve.</div>`;
      } else {
        root.innerHTML = category.tools.map(tool => `
          <article class="tool-card">
            <div class="tool-icon">${tool.icon || "◈"}</div>
            <h2>${tool.name}</h2>
            <p>${tool.description || "Ferramenta online Nexauren."}</p>
            <a class="tool-open" href="${tool.toolPath}">Abrir ferramenta →</a>
          </article>
        `).join("");
      }
    }
  </script>
</body>
</html>
