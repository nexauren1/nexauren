<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ferramentas Nexauren de produtividade."><meta name="robots" content="index,follow"><title>Productivity Tools | Nexauren</title><script src="/js/global-loader.js"></script><style>.category-page{width:min(1120px,92vw);margin:auto;padding:58px 0 80px}.hero{display:grid;grid-template-columns:1fr 360px;gap:42px;align-items:center;margin-bottom:38px}.kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:#eff6ff;color:#3157e8;font-size:11px;font-weight:900;text-transform:uppercase}.category-page h1{margin:17px 0 12px;font-size:clamp(42px,6vw,68px);line-height:.98;letter-spacing:-.055em;color:#172554}.lead{margin:0;color:#64748b;font-size:17px;line-height:1.7}.art{min-height:250px;border-radius:30px;background:linear-gradient(135deg,#3157e8,#06b6d4);display:grid;place-items:center;color:#fff;font-size:70px;box-shadow:0 30px 70px #3157e833}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.empty{padding:38px;border:1px dashed #cbd5e1;border-radius:22px;background:#ffffffb3;color:#64748b;text-align:center}.back{display:inline-flex;margin-top:28px;color:#3157e8;font-weight:800;font-size:13px}@media(max-width:800px){.hero{grid-template-columns:1fr;gap:24px}.art{min-height:190px;font-size:58px}.list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.category-page{width:calc(100% - 28px);padding-top:34px}.category-page h1{font-size:44px}.lead{font-size:15px}.list{grid-template-columns:1fr}}</style></head><body><main class="category-page"><section class="hero"><div><span class="kicker">Productivity · Nexauren Tools</span><h1>Productivity</h1><p class="lead">Ferramentas práticas para organizar tarefas e trabalhar melhor.</p></div><div class="art" aria-hidden="true">✓</div></section><div id="tools" class="list"></div><a class="back" href="/tools/">← Voltar para todas as ferramentas</a></main><script type="module">import{getCategory}from"/categories/category.js";const c=getCategory("productivity"),r=document.getElementById("tools");r.innerHTML=c&&c.tools.length?c.tools.map(t=>`<article class="empty"><strong>${t.name}</strong><p>${t.description||"Ferramenta Nexauren."}</p><a href="${t.toolPath}">Abrir ferramenta →</a></article>`).join(""):'<div class="empty"><strong>Estamos a preparar esta área.</strong><br>Novas ferramentas de Productivity serão adicionadas em breve.</div>';</script></body></html>
