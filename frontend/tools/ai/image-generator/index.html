<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">
<meta property="og:site_name" content="Nexauren">
<meta property="og:type" content="website">
<meta property="og:image" content="https://nexaurenstory.com/favicon.png?v=2">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="Nexauren">
<meta name="twitter:image" content="https://nexaurenstory.com/favicon.png?v=2">







































































































































































  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate and edit images with Nexauren AI Image Generator.">
  <title>AI Image Generator — Nexauren</title>
  <link rel="stylesheet" href="style.css">
  <script src="/js/nexauren-ads.js" defer></script>
  <script src="/js/G4A.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="hero">
      <span class="badge">NEXAUREN AI</span>
      <h1>AI Image Generator</h1>
      <p>Create new images or upload images and describe how you want to transform them.</p>
    </header>

    <section class="card">
      <div class="mode-tabs">
        <button class="mode active" type="button" data-mode="generate">Generate</button>
        <button class="mode" type="button" data-mode="edit">Edit image <span class="pro-tag">PRO</span></button>
      </div>

      <label for="prompt">Describe your image</label>
      <textarea id="prompt" maxlength="2000" placeholder="Example: A futuristic African city at sunset, cinematic lighting, detailed architecture"></textarea>

      <div id="uploadBox" class="upload-box hidden">
        <label for="imageInput" class="upload-label">
          <strong>Upload an image</strong>
          <span>PNG, JPG or WebP · max 10 MB</span>
          <span class="upload-button">Choose image</span>
        </label>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <div id="previewWrap" class="preview hidden">
          <img id="preview" alt="Selected image preview">
          <button id="removeImage" type="button">Remove</button>
        </div>
      </div>

      <div id="referenceBox" class="upload-box hidden">
        <label for="referenceInput" class="upload-label">
          <strong>Upload reference images</strong>
          <span>Premium · choose 2 to 4 PNG, JPG or WebP images · max 10 MB each</span>
          <span class="upload-button">Choose references</span>
        </label>
        <input id="referenceInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
        <div id="referencePreview" class="reference-grid"></div>
      </div>

      <div id="variationBox" class="options hidden">
        <label>
          Variations
          <select id="variationCount">
            <option value="2">2 variations</option>
            <option value="3">3 variations</option>
            <option value="4" selected>4 variations</option>
          </select>
        </label>
      </div>

      <div class="options">
        <label>
          Style
          <select id="style">
            <option value="photorealistic">Photorealistic</option>
            <option value="cinematic">Cinematic</option>
            <option value="digital-art">Digital Art</option>
            <option value="illustration">Illustration</option>
            <option value="minimal">Minimal</option>
          </select>
        </label>
        <label>
          Size
          <select id="size">
            <option value="square">Square</option>
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </label>
      </div>

      <div class="advanced">
        <div class="advanced-head">
          <div>
            <h2>Advanced controls</h2>
            <p>Unlock more creative control with Pro and Premium.</p>
          </div>
          <a href="/plans/">View plans</a>
        </div>
        <div class="feature-grid">
          <button class="feature locked" data-feature="image-editing" type="button">
            <span>✦</span><b>AI Image Editing</b><small>Pro · Upload and transform</small>
          </button>
          <button class="feature locked" data-feature="variations" type="button">
            <span>◈</span><b>Multiple Variations</b><small>Pro · Create 2–4 variations</small>
          </button>
          <button class="feature locked" data-feature="multi-reference" type="button">
            <span>◇</span><b>Multi-Reference</b><small>Premium · Up to 4 images</small>
          </button>
          <button class="feature locked" data-feature="creative-control" type="button">
            <span>✧</span><b>Creative Control</b><small>Premium · Advanced guidance</small>
          </button>
        </div>
      </div>

      <button id="generate" type="button">Generate Image</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result hidden">
      <div class="result-head">
        <h2>Your results</h2>
      </div>
      <div id="resultsGrid" class="results-grid"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
