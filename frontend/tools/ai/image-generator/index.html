<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate images from text with Nexauren AI Image Generator.">
  <title>AI Image Generator — Nexauren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <span class="badge">NEXAUREN AI</span>
      <h1>AI Image Generator</h1>
      <p>Turn your ideas into images with a fast, simple creative workflow.</p>
    </header>

    <section class="card">
      <label for="prompt">Describe your image</label>
      <textarea id="prompt" maxlength="2000" placeholder="Example: A futuristic African city at sunset, cinematic lighting, detailed architecture"></textarea>

      <div class="options">
        <label>
          Style
          <select id="style">
            <option value="photorealistic">Photorealistic</option>
            <option value="cinematic">Cinematic</option>
            <option value="digital-art">Digital Art</option>
            <option value="illustration">Illustration</option>
            <option value="minimal">Minimal</option>
          </select>
        </label>
        <label>
          Size
          <select id="size">
            <option value="square">Square</option>
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </label>
      </div>

      <button id="generate" type="button">Generate Image</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result hidden">
      <div class="result-head">
        <h2>Your image</h2>
        <a id="download" class="download" download="nexauren-ai-image.jpg">Download</a>
      </div>
      <div class="image-wrap">
        <img id="output" alt="AI generated result">
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
