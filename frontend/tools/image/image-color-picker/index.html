<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Color Picker — Nexauren</title><meta name="description" content="Pick colors from any JPG, PNG or WebP image and copy HEX, RGB and HSL values directly in your browser.">
<link rel="stylesheet" href="/css/nexauren-theme.css"><link rel="stylesheet" href="/css/nexauren-pages.css"><link rel="stylesheet" href="style.css">
</head><body><div id="global-header"></div>
<main class="picker-page"><section class="hero"><span class="eyebrow">NEXAUREN · IMAGE</span><h1>Image Color Picker</h1><p>Click any point in your image to instantly pick its color and copy the HEX, RGB or HSL value.</p></section>
<section class="card"><div class="upload" id="dropZone"><div class="icon">◉</div><h2>Drop your image here</h2><p>JPG, PNG or WebP · Processing stays on your device</p><button class="primary" id="choose" type="button">Choose image</button><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></div>
<div class="workspace" id="workspace" hidden><div class="preview"><div class="preview-head"><div><strong id="fileName">Image</strong><span id="fileInfo"></span></div><button class="ghost" id="reset" type="button">New image</button></div><div class="canvas-wrap"><canvas id="canvas"></canvas><div class="crosshair" id="crosshair"></div></div><p class="hint">Click the image to pick a color.</p></div>
<aside class="result"><div class="swatch" id="swatch"></div><div class="picked-label">Selected color</div><div class="hex" id="hex">#000000</div><div class="values"><button class="value" data-copy="hex"><span>HEX</span><b id="hexValue">#000000</b><i>Copy</i></button><button class="value" data-copy="rgb"><span>RGB</span><b id="rgbValue">rgb(0, 0, 0)</b><i>Copy</i></button><button class="value" data-copy="hsl"><span>HSL</span><b id="hslValue">hsl(0, 0%, 0%)</b><i>Copy</i></button></div><div class="recent-title">Recent colors</div><div class="recent" id="recent"></div></aside></div><div class="status" id="status" role="status" aria-live="polite"></div></section></main><div id="global-footer"></div>
<script src="/js/nexauren-ads.js"></script><script src="/js/G4A.js"></script><script src="/js/global-header.js"></script><script src="/js/global-footer.js"></script><script src="/js/global-loader.js"></script><script src="script.js"></script></body></html>
