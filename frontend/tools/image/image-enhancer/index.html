<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Melhore a aparência de imagens no navegador com nitidez, contraste e qualidade ajustáveis.">
  <title>Image Enhancer — Nexauren</title>
  <link rel="stylesheet" href="/css/nexauren-theme.css">
  <link rel="stylesheet" href="/css/nexauren-pages.css">
  <link rel="stylesheet" href="./style.css">
  <script src="/js/global-loader.js" defer></script>
</head>
<body>
  <main class="tool-page">
    <section class="tool-hero">
      <div class="tool-badge">✦ IMAGE</div>
      <h1>Image Enhancer</h1>
      <p>Melhore a aparência da sua imagem com ajustes rápidos de nitidez, contraste, brilho e saturação.</p>
    </section>

    <section class="enhancer-card">
      <div id="uploadArea" class="upload-area">
        <div class="upload-icon">✦</div>
        <h2>Escolha uma imagem</h2>
        <p>JPG, PNG ou WebP. O processamento acontece no navegador.</p>
        <label class="primary-button" for="imageInput">Selecionar imagem</label>
        <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      </div>

      <div id="workspace" class="workspace hidden">
        <div class="preview-panel">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">PRÉ-VISUALIZAÇÃO</span>
              <h2>Imagem melhorada</h2>
            </div>
            <span id="fileInfo" class="file-info"></span>
          </div>
          <div class="preview-wrap">
            <canvas id="previewCanvas"></canvas>
          </div>
        </div>

        <aside class="controls-panel">
          <div class="control">
            <label for="sharpness">Nitidez <span id="sharpnessValue">40%</span></label>
            <input id="sharpness" type="range" min="0" max="100" value="40">
          </div>
          <div class="control">
            <label for="contrast">Contraste <span id="contrastValue">10%</span></label>
            <input id="contrast" type="range" min="-50" max="50" value="10">
          </div>
          <div class="control">
            <label for="brightness">Brilho <span id="brightnessValue">5%</span></label>
            <input id="brightness" type="range" min="-50" max="50" value="5">
          </div>
          <div class="control">
            <label for="saturation">Saturação <span id="saturationValue">5%</span></label>
            <input id="saturation" type="range" min="-50" max="50" value="5">
          </div>

          <div class="actions">
            <button id="enhanceButton" class="primary-button" type="button">Melhorar imagem</button>
            <button id="resetButton" class="secondary-button" type="button">Nova imagem</button>
            <a id="downloadButton" class="download-button hidden" href="#" download>Baixar resultado</a>
          </div>
          <p id="status" class="status" aria-live="polite">Ajuste os controlos e processe a imagem.</p>
        </aside>
      </div>
    </section>
  </main>
  <script src="./script.js" defer></script>
</body>
</html>
