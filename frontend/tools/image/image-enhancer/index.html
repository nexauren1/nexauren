<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Improve images in your browser with adjustable sharpness, contrast and quality."><title>Image Enhancer — Nexauren</title><link rel="stylesheet" href="/css/nexauren-theme.css"><link rel="stylesheet" href="/css/nexauren-pages.css"><link rel="stylesheet" href="./style.css"><script src="/js/global-loader.js" defer></script>
  <script src="/js/nexauren-ads.js" defer></script>
  <script src="/js/G4A.js" defer></script>
</head><body><main class="tool-page"><section class="tool-hero"><div class="tool-badge">✦ IMAGE</div><h1>Image Enhancer</h1><p>Improve your image with quick adjustments for sharpness, contrast, brightness and saturation.</p></section><section class="enhancer-card"><div id="uploadArea" class="upload-area"><div class="upload-icon">✦</div><h2>Choose an image</h2><p>JPG, PNG or WebP. Processing happens in your browser.</p><label class="primary-button" for="imageInput">Select image</label><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div id="workspace" class="workspace hidden"><div class="preview-panel"><div class="panel-heading"><div><span class="eyebrow">PREVIEW</span><h2>Enhanced image</h2></div><span id="fileInfo" class="file-info"></span></div><div class="preview-wrap"><canvas id="previewCanvas"></canvas></div></div><aside class="controls-panel"><div class="control"><label for="sharpness">Sharpness <span id="sharpnessValue">40%</span></label><input id="sharpness" type="range" min="0" max="100" value="40"></div><div class="control"><label for="contrast">Contrast <span id="contrastValue">10%</span></label><input id="contrast" type="range" min="-50" max="50" value="10"></div><div class="control"><label for="brightness">Brightness <span id="brightnessValue">5%</span></label><input id="brightness" type="range" min="-50" max="50" value="5"></div><div class="control"><label for="saturation">Saturation <span id="saturationValue">5%</span></label><input id="saturation" type="range" min="-50" max="50" value="5"></div><div class="actions"><button id="enhanceButton" class="primary-button" type="button">Enhance image</button><button id="resetButton" class="secondary-button" type="button">New image</button><a id="downloadButton" class="download-button hidden" href="#" download>Download result</a></div><p id="status" class="status" aria-live="polite">Adjust the controls and process the image.</p></aside></div></section></main><script src="./script.js" defer></script></body></html>
