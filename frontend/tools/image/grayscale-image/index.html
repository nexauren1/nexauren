  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grayscale Image — Nexauren</title>
  <meta name="description" content="Turn JPG, PNG and WebP images into grayscale directly in your browser.">
  <link rel="stylesheet" href="/css/nexauren-theme.css">
  <link rel="stylesheet" href="/css/nexauren-pages.css">
  <link rel="stylesheet" href="style.css">
  <script src="/js/nexauren-ads.js" defer></script>
  <script src="/js/G4A.js" defer></script>
</head>
<body>
  <div id="global-header"></div>
  <main class="gray-page">
    <section class="gray-hero">
      <span class="eyebrow">NEXAUREN · IMAGE</span>
      <h1>Grayscale Image</h1>
      <p>Convert your image to grayscale with a smooth intensity control, directly in your browser.</p>
    </section>

    <section class="gray-card">
      <div class="upload-zone" id="dropZone">
        <div class="upload-icon">◐</div>
        <h2>Drop your image here</h2>
        <p>JPG, PNG or WebP · Processing stays on your device</p>
        <button class="primary" id="chooseBtn" type="button">Choose image</button>
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      </div>

      <div class="workspace" id="workspace" hidden>
        <div class="preview-wrap">
          <div class="preview-head">
            <div>
              <strong id="fileName">Image</strong>
              <span id="fileInfo"></span>
            </div>
            <button class="ghost" id="resetBtn" type="button">New image</button>
          </div>
          <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
          </div>
        </div>

        <aside class="controls">
          <label class="control-label" for="intensity">Grayscale intensity <b id="intensityValue">100%</b></label>
          <input id="intensity" type="range" min="0" max="100" value="100">
          <div class="range-notes"><span>Original</span><span>Grayscale</span></div>

          <label class="control-label" for="format">Output format</label>
          <select id="format">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPG</option>
            <option value="image/webp">WebP</option>
          </select>

          <label class="control-label" for="quality">Quality <b id="qualityValue">90%</b></label>
          <input id="quality" type="range" min="40" max="100" value="90">

          <button class="primary full" id="downloadBtn" type="button">Download image</button>
          <p class="privacy-note">Your image is processed locally in your browser.</p>
        </aside>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <div id="global-footer"></div>

  <script src="/js/nexauren-ads.js"></script>
  <script src="/js/global-header.js"></script>
  <script src="/js/global-footer.js"></script>
  <script src="/js/global-loader.js"></script>
  <script src="script.js"></script>
</body>
</html>
