<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Blur — Nexauren</title>
<meta name="description" content="Blur an entire image or selected areas directly in your browser.">
<link rel="stylesheet" href="/css/nexauren-theme.css"><link rel="stylesheet" href="/css/nexauren-pages.css"><link rel="stylesheet" href="style.css">
  <script src="/js/nexauren-ads.js" defer></script>
  <script src="/js/G4A.js" defer></script>
</head>
<body>
<div id="nexauren-header"></div>
<main class="page-shell">
<section class="tool-hero"><span class="eyebrow">NEXAUREN · IMAGE</span><h1>Image Blur</h1><p>Blur your image with adjustable intensity. Process everything or paint blur onto selected areas, directly in your browser.</p></section>
<section class="studio-card">
<div class="upload-zone" id="uploadZone"><div class="upload-mark">◌</div><strong>Drop an image here</strong><span>JPG, PNG or WebP · processed locally</span><button class="upload-btn" id="chooseBtn" type="button">Choose image</button><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></div>
<div class="workspace hidden" id="workspace">
<div class="canvas-card"><canvas id="canvas"></canvas><div class="hint">Drag on the image to blur selected areas.</div></div>
<aside class="controls">
<label>Blur mode<select id="mode"><option value="all">Blur entire image</option><option value="brush">Blur selected areas</option></select></label>
<label>Blur strength <output id="strengthOut">12px</output><input id="strength" type="range" min="2" max="40" value="12"></label>
<label>Brush size <output id="brushOut">140px</output><input id="brush" type="range" min="30" max="500" value="140"></label>
<button class="secondary-btn" id="clearBtn" type="button">Clear selected blur</button>
<label>Output<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label>
<div class="actions"><button class="primary-btn" id="downloadBtn" type="button">Download image</button><button class="secondary-btn" id="resetBtn" type="button">New image</button></div>
</aside></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</section></main>
<div id="nexauren-footer"></div>
<script src="/js/nexauren-ads.js"></script><script src="/js/global-header.js"></script><script src="/js/global-footer.js"></script><script src="/js/global-loader.js"></script><script src="script.js"></script>
</body></html>
