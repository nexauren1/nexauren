<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ferramentas Nexauren para editar, melhorar e preparar imagens."><meta name="robots" content="index,follow"><title>Image Tools | Nexauren</title><script src="/js/global-loader.js"></script><style>
.category-page{width:min(1120px,92vw);margin:auto;padding:58px 0 80px}.category-hero{display:grid;grid-template-columns:1fr 360px;gap:42px;align-items:center;margin-bottom:38px}.category-kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:#eef4ff;color:#3157e8;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.category-page h1{margin:17px 0 12px;font-size:clamp(42px,6vw,68px);line-height:.98;letter-spacing:-.055em;color:#172554}.lead{margin:0;color:#64748b;font-size:17px;line-height:1.7;max-width:650px}.category-art{min-height:250px;border-radius:30px;background:linear-gradient(135deg,#06b6d4,#3157e8);box-shadow:0 30px 70px rgba(6,182,212,.2);display:grid;place-items:center;color:#fff;font-size:76px;position:relative;overflow:hidden}.category-art:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-80px;background:rgba(124,58,237,.35)}.category-art span{position:relative;z-index:1}.tools-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tool-card{display:flex;flex-direction:column;padding:21px;border:1px solid #dfe7f5;border-radius:21px;background:rgba(255,255,255,.78);box-shadow:0 18px 50px rgba(46,66,120,.09);min-height:190px}.tool-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#e9fbff;color:#0891b2;font-size:20px;font-weight:900}.tool-card h2{margin:17px 0 7px;font-size:19px;color:#172554}.tool-card p{margin:0;color:#64748b;font-size:14px;line-height:1.6;flex:1}.tool-open{display:inline-flex;justify-content:center;margin-top:18px;padding:11px 14px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#3157e8);color:#fff;font-size:13px;font-weight:850}.empty{padding:38px;border:1px dashed #cbd5e1;border-radius:22px;background:rgba(255,255,255,.7);color:#64748b;text-align:center}.back{display:inline-flex;margin-top:28px;color:#3157e8;font-weight:800;font-size:13px}@media(max-width:800px){.category-hero{grid-template-columns:1fr;gap:24px}.category-art{min-height:190px;font-size:58px}.tools-list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.category-page{width:calc(100% - 28px);padding-top:34px}.category-page h1{font-size:44px}.lead{font-size:15px}.tools-list{grid-template-columns:1fr}.tool-card{min-height:0}}
</style></head>
<body><main class="category-page"><section class="category-hero"><div><span class="category-kicker">Image · Nexauren Tools</span><h1>Image</h1><p class="lead">Ferramentas para editar, melhorar e preparar imagens.</p></div><div class="category-art" aria-hidden="true"><span>✦</span></div></section><section><div id="tools" class="tools-list"></div><a class="back" href="/tools/">← Voltar para todas as ferramentas</a></section></main><script type="module">import{getCategory}from"/categories/category.js";const c=getCategory("image"),r=document.getElementById("tools");if(c&&c.tools.length)r.innerHTML=c.tools.map(t=>`<article class="tool-card"><div class="tool-icon">${t.icon||"✦"}</div><h2>${t.name}</h2><p>${t.description||"Ferramenta online Nexauren."}</p><a class="tool-open" href="${t.toolPath}">Abrir ferramenta →</a></article>`).join("");else r.innerHTML='<div class="empty"><strong>Estamos a preparar esta área.</strong><br>Novas ferramentas de Image serão adicionadas em breve.</div>';</script></body></html>
