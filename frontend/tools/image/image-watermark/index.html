  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Watermark — Nexauren</title>
  <meta name="description" content="Add a customizable text watermark to your image directly in your browser.">
  <link rel="stylesheet" href="/css/nexauren-theme.css">
  <link rel="stylesheet" href="/css/nexauren-pages.css">
  <link rel="stylesheet" href="style.css">
  <script src="/js/nexauren-ads.js" defer></script>
  <script src="/js/G4A.js" defer></script>
</head>
<body>
  <div id="nexauren-header"></div>
  <main class="page-shell">
    <section class="tool-hero">
      <span class="eyebrow">NEXAUREN · IMAGE</span>
      <h1>Image Watermark</h1>
      <p>Add a clean text watermark to your image with live positioning, opacity, size and rotation controls.</p>
    </section>

    <section class="studio-card">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-mark">◆</div>
        <strong>Drop an image here</strong>
        <span>JPG, PNG or WebP · processed locally</span>
        <button class="upload-btn" id="chooseBtn" type="button">Choose image</button>
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      </div>

      <div class="workspace hidden" id="workspace">
        <div class="canvas-card"><canvas id="canvas"></canvas></div>
        <aside class="controls">
          <label>Watermark text<input id="text" type="text" value="NEXAUREN" maxlength="80"></label>
          <label>Position<select id="position">
            <option value="tl">Top left</option><option value="tc">Top center</option><option value="tr">Top right</option>
            <option value="ml">Middle left</option><option value="mc" selected>Center</option><option value="mr">Middle right</option>
            <option value="bl">Bottom left</option><option value="bc">Bottom center</option><option value="br">Bottom right</option>
          </select></label>
          <label>Size <output id="sizeOut">48px</output><input id="size" type="range" min="12" max="180" value="48"></label>
          <label>Opacity <output id="opacityOut">55%</output><input id="opacity" type="range" min="5" max="100" value="55"></label>
          <label>Rotation <output id="rotationOut">0°</output><input id="rotation" type="range" min="-180" max="180" value="0"></label>
          <label>Color<input id="color" type="color" value="#ffffff"></label>
          <label>Output<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label>
          <div class="actions"><button class="primary-btn" id="downloadBtn" type="button">Download image</button><button class="secondary-btn" id="resetBtn" type="button">New image</button></div>
        </aside>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <div id="nexauren-footer"></div>
  <script src="/js/nexauren-ads.js"></script>
  <script src="/js/global-header.js"></script>
  <script src="/js/global-footer.js"></script>
  <script src="/js/global-loader.js"></script>
  <script src="script.js"></script>
</body>
</html>
