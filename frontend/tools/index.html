<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore as ferramentas online do Nexauren por categoria.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ffffff">
  <title>Ferramentas Online | Nexauren</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#101828;--muted:#667085;--line:#e7ebf3;--blue:#2563eb;--violet:#7c3aed;--pink:#ec4899}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fff;background-image:radial-gradient(circle at 8% 0,#dbeafe 0,transparent 22%),radial-gradient(circle at 96% 10%,#f3e8ff 0,transparent 22%)}a{text-decoration:none;color:inherit}
    .nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,5vw);position:sticky;top:0;z-index:20;background:#ffffffdf;backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font-weight:950;letter-spacing:.08em}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--violet),var(--pink));box-shadow:0 8px 22px #7c3aed33}
    .nav-links{display:flex;gap:8px;align-items:center}.nav-link{padding:10px 12px;border-radius:10px;color:#475467;font-weight:700}.nav-link:hover{background:#f2f5fb;color:var(--ink)}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:850;box-shadow:0 10px 24px #2563eb2e}
    .wrap{width:min(1180px,92vw);margin:auto;padding:48px 0 72px}.hero{padding:28px 0 42px}.eyebrow{display:inline-flex;padding:8px 12px;border:1px solid #dbeafe;border-radius:999px;background:#eff6ff;color:var(--blue);font-size:12px;font-weight:850}.hero h1{font-size:clamp(42px,6vw,68px);line-height:1;letter-spacing:-.055em;margin:17px 0 12px}.gradient{background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{color:var(--muted);font-size:18px;line-height:1.7;max-width:700px}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;background:#ffffffd9;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 45px #1d4ed80d;position:sticky;top:86px;z-index:10}.search{flex:1;min-width:220px;position:relative}.search input{width:100%;padding:13px 15px 13px 42px;border:1px solid #dfe5ef;border-radius:12px;outline:0;font:inherit;background:#fff}.search-icon{position:absolute;left:15px;top:12px;color:#98a2b3}.select{padding:12px 13px;border:1px solid #dfe5ef;border-radius:12px;background:#fff;color:#344054;font:inherit;font-weight:700;min-width:180px}.count{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
    .categories{margin-top:24px}.tools-category{margin:0 0 42px}.category-header{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.category-header h2{margin:0;font-size:25px;letter-spacing:-.025em}.category-header span{color:var(--muted);font-size:13px;font-weight:700}.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tool-card{min-height:205px;display:flex;align-items:stretch;gap:8px;padding:21px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 16px 45px #1d4ed80b;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.tool-card:hover{transform:translateY(-6px);box-shadow:0 26px 65px #1d4ed81d;border-color:#d9dff0}.tool-card-main{display:flex;gap:14px;flex:1;min-width:0}.tool-icon{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#f1f5ff;color:#4f46e5;font-size:18px;font-weight:900}.tool-info{min-width:0}.tool-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tool-info h3{margin:1px 0 6px;font-size:18px;letter-spacing:-.02em}.tool-info p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.tool-status{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:10px;font-weight:850;text-transform:uppercase}.tool-info-button{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#667085;cursor:pointer}.tool-info-button:hover{background:#f5f7fb;color:var(--blue)}.empty{padding:45px 20px;border:1px dashed #cbd5e1;border-radius:20px;background:#ffffffb8;text-align:center}.empty h3{margin:0 0 7px}.muted{color:var(--muted);line-height:1.6}.footer{border-top:1px solid var(--line);padding:32px 0;color:#98a2b3;font-size:13px}
    @media(max-width:900px){.tools-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.nav-links{display:none}.wrap{width:92vw;padding-top:32px}.hero h1{font-size:44px}.toolbar{position:static}.tools-grid{grid-template-columns:1fr}.tool-card{min-height:0}.category-header{align-items:flex-start;gap:8px;flex-direction:column}}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><span class="brand-mark"></span><span>NEXAUREN</span></a>
    <div class="nav-links"><a class="nav-link" href="/">Início</a><a class="nav-link" href="/account">Minha conta</a><a class="btn" href="/register">Criar conta →</a></div>
  </nav>
  <main class="wrap">
    <section class="hero"><span class="eyebrow">✦ Nexauren Tools Library</span><h1>Encontre a ferramenta <span class="gradient">certa.</span></h1><p class="lead">Pesquise, filtre por categoria e abra uma ferramenta em segundos.</p></section>
    <div class="toolbar"><div class="search"><span class="search-icon">⌕</span><input id="q" placeholder="Pesquisar ferramentas..." autocomplete="off"></div><select class="select" id="cat"><option value="">Todas as categorias</option></select><span class="count"><b id="n">0</b> ferramenta(s)</span></div>
    <div id="categories" class="categories"></div>
  </main>
  <footer class="footer"><div class="wrap" style="padding:0">© Nexauren — Ferramentas digitais.</div></footer>
  <script type="module">
    import { getCategories } from "/categories/category.js";

    const allCategories = getCategories();
    const q = document.getElementById("q");
    const cat = document.getElementById("cat");
    const root = document.getElementById("categories");
    const n = document.getElementById("n");

    for (const category of allCategories) {
      const option = document.createElement("option");
      option.value = category.slug;
      option.textContent = category.name;
      cat.appendChild(option);
    }

    const params = new URLSearchParams(location.search);
    cat.value = params.get("category") || "";

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
    }

    function render() {
      const query = q.value.trim().toLowerCase();
      const selected = cat.value;
      let total = 0;

      const html = allCategories.map(category => {
        if (selected && category.slug !== selected) return "";
        const items = category.tools.filter(tool => {
          const haystack = [tool.name, tool.description, tool.category].join(" ").toLowerCase();
          return !query || haystack.includes(query);
        });
        if (!items.length) return "";
        total += items.length;
        return `<section class="tools-category" data-category="${esc(category.slug)}"><div class="category-header"><div><h2>${esc(category.name)}</h2><span>${items.length} ferramenta${items.length === 1 ? "" : "s"}</span></div></div><div class="tools-grid">${items.map(tool => `<article class="tool-card"><a class="tool-card-main" href="${esc(tool.toolPath)}"><div class="tool-icon">${esc(tool.icon || "◈")}</div><div class="tool-info"><div class="tool-title-row"><h3>${esc(tool.name)}</h3><span class="tool-status">${esc(tool.status)}</span></div><p>${esc(tool.description || "")}</p></div></a><button class="tool-info-button" type="button" title="Informações" data-tool-info="${esc(tool.id)}">ℹ️</button></article>`).join("")}</div></section>`;
      }).join("");

      n.textContent = total;
      root.innerHTML = html || `<div class="empty"><h3>Nada encontrado</h3><p class="muted">Tente outro termo ou categoria.</p></div>`;
      root.querySelectorAll("[data-tool-info]").forEach(button => button.addEventListener("click", () => {
        const id = button.dataset.toolInfo;
        const tool = allCategories.flatMap(c => c.tools).find(t => t.id === id);
        if (tool) alert(`${tool.name}\n\n${tool.description}\n\nVersão: ${tool.version || "—"}`);
      }));
    }

    q.addEventListener("input", render);
    cat.addEventListener("change", () => {
      const url = new URL(location.href);
      if (cat.value) url.searchParams.set("category", cat.value); else url.searchParams.delete("category");
      history.replaceState({}, "", url);
      render();
    });
    render();
  </script>
</body>
</html>
