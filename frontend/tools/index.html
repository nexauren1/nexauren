<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Explore Nexauren tools by category."><title>Tools — Nexauren</title><style>:root{--ink:#172033;--muted:#667085;--line:#e5e9f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.brand{font-weight:950;letter-spacing:.09em}.navlinks{display:flex;gap:8px}.navlinks a{font-size:12px;font-weight:800;color:var(--muted)}.hero{padding:58px 0 30px}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:14px 0 9px;font-size:clamp(42px,7vw,64px);line-height:1;letter-spacing:-.065em}.hero h1 span{background:linear-gradient(90deg,#16a34a,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:650px;margin:0;color:var(--muted);font-size:15px;line-height:1.65}.search{width:100%;height:48px;margin:0 0 28px;padding:0 15px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.category{position:relative;display:block;min-height:195px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;transition:.2s}.category:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--accent)}.category:hover{transform:translateY(-3px);box-shadow:0 18px 38px #10182812}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--accent);font-size:21px;font-weight:950}.category h2{margin:16px 0 5px;font-size:20px}.category p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.go{position:absolute;right:18px;bottom:15px;color:var(--accent);font-size:18px;font-weight:900}footer{margin-top:70px;padding:24px 0;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding:40px 0 26px}.navlinks{display:none}}</style>

</head><body><header class="wrap nav"><a class="brand" href="/">NEXAUREN</a><div class="navlinks"><a href="/about/">About</a><a href="/faq/">FAQ</a><a href="/account/">Account</a></div></header><main class="wrap"><section class="hero"><span class="eyebrow">Nexauren toolkit</span><h1>Choose a category.<br><span>Find your tool.</span></h1><p>Each category is its own page. Open one to load only the tools that belong to that category.</p></section><input id="search" class="search" type="search" placeholder="Search categories…"><section id="grid" class="grid"></section></main><footer><div class="wrap">© 2026 Nexauren · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a> · <a href="/cookies/">Cookies</a></div></footer><script>const categories=[{slug:'pdf',name:'PDF',icon:'▤',accent:'#d49b08',soft:'#fff8df',description:'Create, convert, edit and organize PDF files.'},{slug:'image',name:'Image',icon:'◈',accent:'#e24b64',soft:'#fff0f3',description:'Edit, transform and optimize images.'},{slug:'ai',name:'AI',icon:'✦',accent:'#7657d9',soft:'#f3efff',description:'Practical AI tools for creating and working faster.'},{slug:'audio',name:'Audio',icon:'♫',accent:'#159a61',soft:'#e9fbf2',description:'Work with sound, music and audio files.'},{slug:'text',name:'Text',icon:'T',accent:'#2563eb',soft:'#edf4ff',description:'Format, transform and work with text and data.'},{slug:'marketplace',name:'Marketplace',icon:'◇',accent:'#db6b20',soft:'#fff2e8',description:'Create product listings and selling assets.'},{slug:'utilities',name:'Utilities',icon:'◷',accent:'#0891b2',soft:'#e8f9fc',description:'Useful everyday utilities.'}];const grid=document.querySelector('#grid'),search=document.querySelector('#search');function render(){const q=search.value.toLowerCase().trim();grid.innerHTML=categories.filter(c=>(c.name+' '+c.description).toLowerCase().includes(q)).map(c=>`<a class="category" href="/tools/${c.slug}/" style="--accent:${c.accent};--soft:${c.soft}"><div class="icon">${c.icon}</div><h2>${c.name}</h2><p>${c.description}</p><span class="go">→</span></a>`).join('')}search.addEventListener('input',render);render();</script></body></html>
