<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Explore Nexauren text tools in one place."><title>Text Tools — Nexauren</title><style>:root{--accent:#2563eb;--soft:#edf4ff;--ink:#172033;--muted:#667085;--line:#e6e9ef;--bg:#f8f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.brand{font-weight:950;letter-spacing:.09em}.back{font-size:13px;font-weight:800;color:var(--muted)}main{padding:48px 0 70px}.hero{padding:34px 0 30px}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:15px 0 8px;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.06em}.hero p{max-width:680px;margin:0;color:var(--muted);font-size:15px;line-height:1.7}.tools-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tool{position:relative;min-height:180px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;transition:.2s;overflow:hidden}.tool:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--accent)}.tool:hover{transform:translateY(-3px);box-shadow:0 18px 40px #10182812}.icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--accent);font-weight:950;font-size:19px}.tool h2{font-size:17px;margin:15px 0 7px}.tool p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.open{position:absolute;left:20px;bottom:17px;color:var(--accent);font-size:12px;font-weight:900}.count{margin:0 0 18px;color:var(--muted);font-size:12px;font-weight:750}.state{padding:35px;border:1px dashed var(--line);border-radius:18px;background:#fff;color:var(--muted);text-align:center}footer{border-top:1px solid var(--line);background:#fff;padding:25px 0;color:#98a2b3;font-size:11px}footer a{color:#667085;margin-left:10px}@media(max-width:900px){.tools-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.tools-grid{grid-template-columns:repeat(2,1fr);gap:10px}.tool{min-height:170px;padding:15px}.open{left:15px;bottom:14px}.hero{padding-top:20px}}@media(max-width:420px){.tool h2{font-size:14px}.tool p{font-size:11px}.icon{width:40px;height:40px}}</style>

</head><body><header class="nav"><div class="wrap nav"><a class="brand" href="/">NEXAUREN</a><a class="back" href="/category/">All categories →</a></div></header><main class="wrap"><section class="hero"><span class="eyebrow">Nexauren · Text</span><h1>Text tools.</h1><p>Format, transform and work with text and structured data in one focused workspace.</p></section><p id="count" class="count">Loading tools…</p><section id="grid" class="tools-grid"><div class="state">Loading text tools…</div></section></main><footer><div class="wrap">© 2026 Nexauren · <a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/cookies/">Cookies</a></div></footer><script>const category='text',grid=document.querySelector('#grid'),count=document.querySelector('#count');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');fetch('/data/tools.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const a=Array.isArray(d)?d:d.tools||[],list=a.filter(t=>t.category===category&&t.status==='published');count.textContent=`${list.length} ${list.length===1?'tool':'tools'} available`;grid.innerHTML=list.map(t=>`<a class="tool" href="${esc(t.toolPath)}"><div class="icon">${esc(t.icon||'◈')}</div><h2>${esc(t.name)}</h2><p>${esc(t.description||'')}</p><span class="open">Open tool →</span></a>`).join('')||'<div class="state">No published tools in this category yet.</div>'}).catch(()=>{count.textContent='';grid.innerHTML='<div class="state">We could not load the tools right now. Please try again.</div>'});</script></body></html>
