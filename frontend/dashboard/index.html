<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Nexauren</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}.nav{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:950;letter-spacing:.08em;text-decoration:none;color:#101828}.brand span{color:#7c3aed}.links{display:flex;gap:8px;align-items:center}.links a,.links button{border:0;background:none;padding:9px 11px;border-radius:10px;color:#475467;text-decoration:none;font:inherit;font-weight:750;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#7c3aed)!important;color:#fff!important}.wrap{width:min(1120px,92vw);margin:auto;padding:42px 0 70px}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:850}.lead,.muted{color:#667085;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 15px 45px #1d4ed80b}.num{font-size:34px;font-weight:950;margin-top:8px}.gold{color:#b7791f}.blue{color:#2563eb}.btn{display:inline-flex;padding:11px 15px;border-radius:11px;border:0;background:#101828;color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5}.footer{text-align:center;border-top:1px solid #e5e7eb;padding:25px;color:#98a2b3}@media(max-width:700px){.grid{grid-template-columns:1fr}.links a{display:none}}</style></head><body><nav class="nav"><a class="brand" href="/">NEXA<span>UREN</span></a><div class="links"><a href="/tools/">Tools</a><a href="/plans/">Plans</a><a href="/account/">Account</a><button id="logout">Sign out</button></div></nav><main class="wrap"><span class="pill">DASHBOARD</span><h1 id="hello">Loading...</h1><p class="lead">Your plan, credits and activity.</p><div class="grid"><section class="card"><span class="pill">PLAN</span><h2 id="plan">—</h2><p class="muted" id="price">—</p><a class="btn primary" href="/plans/">Manage plan</a></section><section class="card"><span class="pill">PLAN CREDITS</span><div class="num blue" id="planCredits">—</div><p class="muted">Monthly credits</p></section><section class="card"><span class="pill" style="background:#fff7df;color:#b7791f">PURCHASED CREDITS</span><div class="num gold" id="purchased">—</div><p class="muted">Purchased credits</p></section></div><section class="card" style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2>Tools</h2><p class="muted">Explore the available tools.</p></div><a class="btn primary" href="/tools/">Explore</a></div></section><section class="card" style="margin-top:20px"><h2>Credit history</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Source</th><th>Amount</th></tr></thead><tbody id="history"></tbody></table></div></section></main><footer class="footer">© 2026 Nexauren · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></footer><script>async function load(){const r=await fetch('/api/account');if(r.status===401){location.href='/login/';return}const d=await r.json();hello.textContent='Hello, '+(d.user?.name||'user')+'.';plan.textContent=d.subscription?.plan_name||'Free';price.textContent='$'+Number(d.subscription?.price||0).toFixed(2)+' / month';planCredits.textContent=Number(d.balance?.plan_credits||0).toLocaleString();purchased.textContent=Number(d.balance?.purchased_credits||0).toLocaleString();history.innerHTML=(d.history||[]).map(x=>'<tr><td>'+new Date(Number(x.created_at)).toLocaleString()+'</td><td>'+x.type+'</td><td>'+x.source+'</td><td>'+(Number(x.amount)>0?'+':'')+x.amount+'</td></tr>').join('')||'<tr><td colspan="4">No transactions yet.</td></tr>'}logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();</script><script src="/js/global-loader.js"></script></body></html>
