<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Nexauren</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}.nav{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:950;letter-spacing:.08em;text-decoration:none;color:#101828}.brand span{color:#7c3aed}.nav a{color:#475467;font-weight:750;text-decoration:none}.wrap{min-height:calc(100vh - 135px);display:grid;place-items:center;padding:40px 18px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:30px;box-shadow:0 20px 60px #1d4ed80d}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:850}.card h1{font-size:38px;letter-spacing:-.04em;margin:16px 0 8px}.muted{color:#667085;line-height:1.6}.field{width:100%;padding:13px 14px;margin:8px 0;border:1px solid #dfe5ef;border-radius:12px;font:inherit}.btn{width:100%;border:0;padding:13px 16px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font:inherit;font-weight:850;cursor:pointer;margin-top:8px}.error{color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:12px;padding:10px;display:none}.footer{text-align:center;border-top:1px solid #e5e7eb;padding:22px;color:#98a2b3}.footer a{color:#667085;margin:0 6px}</style></head>
<body><nav class="nav"><a class="brand" href="/">NEXA<span>UREN</span></a><a href="/register/">Criar conta</a></nav><main class="wrap"><section class="card"><span class="pill">NEXAUREN ACCOUNT</span><h1>Entrar</h1><p class="muted">Aceda às suas ferramentas, créditos e conta.</p><div id="error" class="error"></div><form id="form"><input class="field" id="email" type="email" placeholder="Email" required autocomplete="email"><input class="field" id="password" type="password" placeholder="Senha" required minlength="8" autocomplete="current-password"><button class="btn" type="submit">Entrar</button></form><p class="muted">Ainda não tem conta? <a href="/register/">Criar conta</a></p></section></main><footer class="footer">© 2026 Nexauren · <a href="/privacy/">Privacidade</a> · <a href="/terms/">Termos</a></footer><script>const form=document.getElementById('form'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){error.textContent=d.error||'Não foi possível entrar.';error.style.display='block';return}location.href='/dashboard/';});</script><script src="/js/global-loader.js"></script></body></html>
