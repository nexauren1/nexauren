<style>
:root{--bg:#fbfaf6;--card:#fff;--ink:#171717;--muted:#6b7280;--line:#e8e3d7;--accent:#7257d9;--soft:#f0edff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}
.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:.08em}.back{font-size:13px;font-weight:800;color:var(--muted)}
.hero{padding:58px 0 30px}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.1em}.hero h1{font-size:clamp(42px,8vw,72px);line-height:.95;letter-spacing:-.065em;margin:16px 0 12px}.hero p{max-width:690px;color:var(--muted);font-size:16px;line-height:1.7;margin:0}
.controls{display:flex;gap:10px;margin:8px 0 25px}.search{height:48px;flex:1;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 15px;font-size:14px;outline:0}.search:focus{border-color:#b8a9ef;box-shadow:0 0 0 4px #7257d914}.select{height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 12px;font-weight:700;color:#555}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #30251510}.cover{height:185px;background:var(--soft);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:18px}.meta{display:flex;gap:8px;align-items:center;color:#918a7b;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.tag{color:var(--accent)}h2{font-size:19px;line-height:1.25;margin:10px 0 7px;letter-spacing:-.02em}.excerpt{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.read{display:inline-block;margin-top:15px;font-size:11px;font-weight:900;color:var(--accent)}.empty{text-align:center;padding:55px 20px;border:1px dashed #d7cfba;border-radius:18px;background:#fff;color:var(--muted)}footer{margin-top:65px;border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:11px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{padding:40px 0 25px}.controls{flex-direction:column}.grid{grid-template-columns:1fr}.cover{height:200px}}
</style>
  <script src="/js/G4A.js" defer></script>
</head>
<body>
<header class="wrap nav"><a class="brand" href="/">NEXAUREN</a><a class="back" href="/tools/">← Tools</a></header>
<main class="wrap">
<section class="hero"><span class="eyebrow">NEXAUREN · BLOG</span><h1>Ideas worth reading.</h1><p>Technology, news, culture, business and practical guides — published by Nexauren.</p></section>
<div class="controls"><input id="search" class="search" type="search" placeholder="Search articles…" autocomplete="off"><select id="category" class="select"><option value="">All categories</option></select></div>
<section id="posts" class="grid" aria-live="polite"></section><section id="empty" class="empty" hidden>No articles found.</section>
</main><footer><div class="wrap">© 2026 Nexauren · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></div></footer>
<script src="/blog/blog.js" defer></script>
</body></html>
